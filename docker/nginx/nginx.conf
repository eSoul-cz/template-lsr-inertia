worker_processes auto;
events {
    worker_connections 128;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    gzip on;

    # Development only: RoadRunner serves the app over FastCGI (the production path), Vite serves the assets with HMR.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location / {
            fastcgi_pass app:9000;
            # SCRIPT_FILENAME is required by the FastCGI protocol but unused: RoadRunner routes by REQUEST_URI.
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            # What the app learns about the visitor comes from NGINX, as on the production hosts: a parameter set here
            # replaces the request header of the same name, so a forged X-Forwarded-* header never reaches the app.
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTPS $https if_not_empty;
        }
    }

    server {
        listen 5173;
        listen [::]:5173;
        server_name _;

        location / {
            proxy_pass http://app:5173;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
